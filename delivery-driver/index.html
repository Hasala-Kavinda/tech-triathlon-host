  <script>

  <link rel="stylesheet" href="/styles/tokens.css" />

  <style>
    @keyframes cursor-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-caret {
      animation: cursor-pulse 0.9s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-blink {
      animation: blink 1s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.15; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .halo-pulse {
      animation: pulse-ring 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      transform-origin: center;
    }
    @keyframes driver-pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }
    .driver-halo {
      animation: driver-pulse 2s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-bg text-primary antialiased w-full min-h-screen">
  <div id="root" class="w-full min-h-screen"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
